# Workflow ALTERNATIVO para Azure Static Web Apps (Opción B)
#
# USO:
#   1. En Azure Portal, crear un recurso "Static Web App" (gratis)
#   2. Al crearlo, Azure generará automáticamente el secret AZURE_STATIC_WEB_APPS_API_TOKEN
#   3. Agregar ese token en GitHub → Settings → Secrets → AZURE_STATIC_WEB_APPS_API_TOKEN
#   4. Renombrar/activar este archivo y deshabilitar main_farmacia-front.yml
#
# NOTA: Este workflow está deshabilitado por defecto (solo se ejecuta manualmente).
#       Para activarlo en push, cambia el trigger "workflow_dispatch" por "push".

name: Azure Static Web Apps Deploy - farmacia-front

on:
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build and Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'Front/reservas-frontend'
          output_location: 'dist'
          skip_api_build: true
